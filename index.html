<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS / Finance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:      #060a0f;
    --surface: #0d1117;
    --border:  #1c2333;
    --text:    #f0f6fc;
    --muted:   #8b949e;
    --accent:  #4a9eff;
    --green:   #39d353;
    --red:     #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
    background-image: radial-gradient(circle at 1px 1px, #1c2333 1px, transparent 0);
    background-size: 28px 28px;
  }
  #dashboard { max-width: 1280px; margin: 0 auto; padding: 32px 24px; }
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .logo span { color: var(--accent); }
  .updated { font-size: 11px; color: var(--muted); font-family: monospace; }
  .hero {
    margin-bottom: 48px;
  }
  .hero-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .hero-value {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -3px;
    color: var(--text);
    line-height: 1;
  }
  .hero-sub {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    gap: 24px;
  }
  .hero-sub span { color: var(--text); }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .stat {
    background: var(--surface);
    padding: 20px;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .chart-card {
    background: var(--surface);
    padding: 24px;
  }
  .section-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }
  canvas { max-height: 240px; }
  .table-card {
    border: 1px solid var(--border);
    background: var(--surface);
    margin-bottom: 24px;
  }
  .table-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 10px 20px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }
  td { padding: 12px 20px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(74, 158, 255, 0.03); }
  .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
  .tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 2px 7px;
    border: 1px solid var(--border);
    color: var(--muted);
    text-transform: uppercase;
  }
  @media (max-width: 768px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .charts-row { grid-template-columns: 1fr; }
    .hero-value { font-size: 40px; }
  }
</style>
</head>
<body>

<div id="dashboard">
  <header class="site-header">
    <div class="logo"><span>KCH</span> / OS — FINANCE</div>
    <div class="updated">SNAPSHOT // 2026-06-18</div>
  </header>

  <div class="hero">
    <div class="hero-label">Total Net Worth</div>
    <div class="hero-value" id="nw-value"></div>
    <div class="hero-sub" id="nw-sub"></div>
  </div>

  <div class="stat-grid" id="stats"></div>

  <div class="charts-row">
    <div class="chart-card">
      <div class="section-label">June 2026 — Spending by Category</div>
      <canvas id="pieChart"></canvas>
    </div>
    <div class="chart-card">
      <div class="section-label">Monthly Spend Trend</div>
      <canvas id="barChart"></canvas>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">Investment Portfolio</div>
    <table id="portfolio-table"></table>
  </div>
</div>

<script>
const D = {
  "updated": "2026-06-18",
  "net_worth": {
    "total": 51293.74,
    "cash": 10421.14,
    "taxable": 37600.65,
    "ira": 3271.95
  },
  "income": {
    "avg_monthly_net": 6852.95,
    "ytd_net": 25293.23
  },
  "monthly_spending": {
    "2026-01": {
      "Other": 51.8,
      "Transportation": 40.0
    },
    "2026-02": {
      "Workspace": 125.75,
      "Health": 55.0,
      "Food & Dining": 50.56,
      "Entertainment": 50.0,
      "Shopping": 22.97
    },
    "2026-03": {
      "Housing": 1398.0,
      "Food & Dining": 405.76,
      "Workspace": 219.16,
      "Transportation": 98.97,
      "Shopping": 58.48,
      "Entertainment": 57.26
    },
    "2026-04": {
      "Housing": 1398.0,
      "Food & Dining": 287.49,
      "Auto": 238.75,
      "Workspace": 216.85,
      "Insurance": 176.0
    },
    "2026-05": {
      "Housing": 1398.0,
      "Food & Dining": 391.4,
      "Insurance": 290.0,
      "Entertainment": 144.0,
      "Workspace": 109.15
    },
    "2026-06": {
      "Housing": 1212.26,
      "Insurance": 800.0,
      "Food & Dining": 231.16,
      "Trading": 50.21,
      "Workspace": 45.54,
      "Entertainment": 35.0
    }
  },
  "monthly_totals": {
    "2026-01": 91.8,
    "2026-02": 304.28,
    "2026-03": 2237.63,
    "2026-04": 2317.09,
    "2026-05": 2332.55,
    "2026-06": 2374.17
  },
  "latest_month": "2026-06",
  "total_spend_latest": 2374.17,
  "portfolio": {
    "total": 40872.6,
    "total_gain": 7156.17,
    "positions": [
      {
        "symbol": "VOO",
        "value": 22073.89,
        "gain": 1784.52,
        "gain_pct": 8.8,
        "account": "Schwab"
      },
      {
        "symbol": "SPY",
        "value": 10438.96,
        "gain": 3809.99,
        "gain_pct": 57.47,
        "account": "Schwab"
      },
      {
        "symbol": "SWPPX",
        "value": 3965.31,
        "gain": 604.34,
        "gain_pct": 17.98,
        "account": "Schwab"
      },
      {
        "symbol": "VOO",
        "value": 2508.27,
        "gain": 708.48,
        "gain_pct": 39.36,
        "account": "Fidelity Roth"
      },
      {
        "symbol": "VXUS",
        "value": 1032.25,
        "gain": 32.25,
        "gain_pct": 3.22,
        "account": "Schwab"
      },
      {
        "symbol": "FXAIX",
        "value": 756.59,
        "gain": 216.59,
        "gain_pct": 40.11,
        "account": "Fidelity Roth"
      }
    ]
  },
  "category_colors": {
    "Food & Dining": "#f59e0b",
    "Housing": "#3b82f6",
    "Transportation": "#8b5cf6",
    "Entertainment": "#10b981",
    "Auto": "#f43f5e",
    "Health": "#06b6d4",
    "Shopping": "#f97316",
    "Workspace": "#a78bfa",
    "Insurance": "#64748b",
    "Investments": "#22c55e",
    "Fees": "#ef4444",
    "Trading": "#fbbf24",
    "Other": "#94a3b8"
  }
};

renderDashboard();
function renderDashboard() {
  const nw = D.net_worth;
  document.getElementById("nw-value").textContent = fmt(nw.total);
  document.getElementById("nw-sub").innerHTML =
    `<div>Liquid Cash <span>${fmt(nw.cash)}</span></div>` +
    `<div>Taxable Investments <span>${fmt(nw.taxable)}</span></div>` +
    `<div>Roth IRA <span>${fmt(nw.ira)}</span></div>`;

  // Stat cards
  const avgMonthly = D.income.avg_monthly_net;
  const totalSpend = D.total_spend_latest;
  const savingsRate = avgMonthly > 0 ? Math.round((1 - totalSpend / avgMonthly) * 100) : 0;

  const stats = [
    { label: "Avg Monthly Income", value: fmt(avgMonthly), sub: `YTD net ${fmt(D.income.ytd_net)}` },
    { label: "Monthly Spend", value: fmt(totalSpend), sub: `${D.latest_month || "Latest"}` },
    { label: "Est. Savings Rate", value: savingsRate + "%", sub: `~${fmt(avgMonthly - totalSpend)} / mo kept`, cls: savingsRate > 40 ? "pos" : "" },
    { label: "Portfolio Gain", value: fmt(D.portfolio.total_gain), sub: "unrealized", cls: "pos" },
  ];

  const statsEl = document.getElementById("stats");
  stats.forEach(s => {
    statsEl.innerHTML += `<div class="stat">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value ${s.cls || ''}">${s.value}</div>
      <div class="stat-sub">${s.sub}</div>
    </div>`;
  });

  // Pie chart
  const latestSpend = D.monthly_spending[D.latest_month] || {};
  const pieLabels = Object.keys(latestSpend);
  const pieData   = Object.values(latestSpend);
  const pieColors = pieLabels.map(l => D.category_colors[l] || "#94a3b8");

  new Chart(document.getElementById("pieChart"), {
    type: "doughnut",
    data: {
      labels: pieLabels,
      datasets: [{ data: pieData, backgroundColor: pieColors, borderWidth: 0, hoverOffset: 8 }],
    },
    options: {
      plugins: {
        legend: {
          position: "right",
          labels: { color: "#8b949e", font: { size: 11 }, padding: 10, boxWidth: 10 },
        },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmt(ctx.raw)}` } },
      },
      cutout: "64%",
    },
  });

  // Bar chart
  const barMonths = Object.keys(D.monthly_totals);
  const barVals   = Object.values(D.monthly_totals);
  const barLabels = barMonths.map(m => {
    const [y, mo] = m.split("-");
    return new Date(+y, +mo - 1).toLocaleString("en-US", { month: "short" });
  });

  new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: {
      labels: barLabels,
      datasets: [{
        label: "Total Spend",
        data: barVals,
        backgroundColor: "rgba(74, 158, 255, 0.7)",
        borderRadius: 2,
        borderSkipped: false,
      }],
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${fmt(ctx.raw)}` } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: "#8b949e", font: { size: 11 } } },
        y: {
          grid: { color: "#1c2333" },
          ticks: { color: "#8b949e", font: { size: 11 }, callback: v => "$" + v.toLocaleString() },
        },
      },
    },
  });

  // Portfolio table
  const tbl = document.getElementById("portfolio-table");
  tbl.innerHTML = `<tr>
    <th>Symbol</th><th>Account</th>
    <th style="text-align:right">Value</th>
    <th style="text-align:right">Gain / Loss</th>
    <th style="text-align:right">Return</th>
  </tr>`;

  D.portfolio.positions.forEach(p => {
    const cls = p.gain >= 0 ? "pos" : "neg";
    const sign = p.gain >= 0 ? "+" : "";
    tbl.innerHTML += `<tr>
      <td><span class="mono">${p.symbol}</span></td>
      <td><span class="tag">${p.account}</span></td>
      <td style="text-align:right">${fmt(p.value)}</td>
      <td style="text-align:right" class="${cls}">${sign}${fmt(Math.abs(p.gain))}</td>
      <td style="text-align:right" class="${cls}">${sign}${p.gain_pct.toFixed(2)}%</td>
    </tr>`;
  });

  const totalGain = D.portfolio.total_gain;
  tbl.innerHTML += `<tr style="font-weight:700">
    <td class="mono">TOTAL</td><td></td>
    <td style="text-align:right">${fmt(D.portfolio.total)}</td>
    <td style="text-align:right" class="pos">+${fmt(totalGain)}</td>
    <td></td>
  </tr>`;
}

function fmt(n) {
  return "$" + (+n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
</script>
</body>
</html>
